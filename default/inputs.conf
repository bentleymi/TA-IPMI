[script://./bin/ipmi_sensors_events.py]
interval = 60
index = main
sourcetype = ipmi:status
source = ipmi-sensors
disabled = 0
python.version = python3
python.required = 3.13

[script://./bin/ipmi_sensors_metrics.py]
interval = 60
index = metrics
sourcetype = ipmi:metrics
source = ipmi-sensors-metrics
disabled = 0
python.version = python3
python.required = 3.13

[script://./bin/ipmi_sel_events.py]
interval = 120
index = main
sourcetype = ipmi:sel
source = ipmi-sel
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-IPMI/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license:TA-IPMI
disabled = 0
python.version = python3
python.required = 3.13
